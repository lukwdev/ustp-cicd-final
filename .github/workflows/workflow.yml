name: Build and Artifacts V2

on:
  push:
    branches: ['main']
    tags: ['v*.*.*']
  pull_request:
    branches: ['**']

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want those production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------
  # BUILD JOB
  # ---------------------------------------------------
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Upload Web App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-app-bundle-${{ matrix.os }}
          path: dist/
          retention-days: 5
          if-no-files-found: error

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}
          path: coverage/
          retention-days: 5

  # ---------------------------------------------------
  # 2. DEPLOY TO PAGES JOB
  # ---------------------------------------------------
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-and-test

    # SECURITY: Only run this on the main branch.
    # You don't want PRs or random tags overwriting your website.
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          # We download ONLY the Ubuntu bundle for the website
          name: web-app-bundle-ubuntu-latest
          path: public

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The download step above extracted the files into 'public'
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------
  # RELEASE JOB
  # ---------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only run this job if it is a tag
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false

      - name: Display downloaded files (Debug)
        run: ls -R release-assets

      - name: Zip Artifacts to avoid name collisions
        run: |
          cd release-assets
          # Loop through each artifact folder and zip it
          for dir in */; do
            zip -r "${dir%/}.zip" "$dir"
          done
          # Optional: List files to verify
          ls -l *.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: USTP CI/CD Tetris ${{ github.ref_name }}
          files: ./release-assets/**
          generate_release_notes: true
          draft: false
          prerelease: false